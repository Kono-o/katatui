[package]
name = "katatui"
version = "0.1.0"
edition = "2024"
authors = ["Kono"]
description = "kono's tui making library."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Kono-o/katatui"
keywords = ["tui", 'cli']
categories = ["command-line-utilities"]
homepage = "https://github.com/Kono-o/katatui"
documentation = "https://docs.rs/katatui"

[dependencies]
ratatui = "0.30.0"
anyhow = "1.0.102"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1.49", features = ["full"] }
tokio-tungstenite = "0.28"
futures = "0.3"
prost = "0.14.3"

[profile.release]
strip = true
opt-level = "z"
lto = true
